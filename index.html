<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoSabotage · Barranquilla No Se Apaga</title>
<style>
/* ============================================================
   1. TEMA CYBERPUNK / GAMER NEÓN
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:wght@400;700&display=swap');

:root{
  --fondo:#050714; --panel:rgba(19,23,54,0.7); --panel2:#1b2048; --linea:#2a3070;
  --texto:#e9ecff; --suave:#9aa2d6;
  --cian:#00f3ff; --magenta:#ff0055; --ambar:#ffea00; --verde:#00ff88;
  --display:'Chakra Petch', system-ui, sans-serif;
  --cuerpo:'DM Sans', system-ui, sans-serif;
  --cctv-scan: rgba(255, 255, 255, 0.03);
}
*{box-sizing:border-box}
html,body{margin:0; overflow-x: hidden;}
body{
  min-height:100vh; color:var(--texto); font-family:var(--cuerpo);
  background: 
    radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.1), transparent 50%),
    radial-gradient(circle at 85% 30%, rgba(255, 0, 85, 0.15), transparent 50%),
    var(--fondo);
  background-attachment:fixed;
}
body::before {
  content:""; position:fixed; top:0; left:0; width:100vw; height:100vh;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, var(--cctv-scan) 2px, var(--cctv-scan) 4px);
  pointer-events:none; z-index:999; opacity:0.6;
}

.wrap{max-width:1100px;margin:0 auto;padding:0 18px 70px; position:relative; z-index:10;}
h1,h2,h3,strong,.marca,.banner{font-family:var(--display)}
h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.1;margin:0 0 12px; text-transform:uppercase; letter-spacing:1px;}
h2{font-size:1.6rem;margin:22px 0 10px; text-transform:uppercase; border-bottom:1px solid var(--linea); padding-bottom:5px; color:var(--cian);}
h3{margin:0 0 6px;font-size:1.2rem; color:#fff;}
p{line-height:1.5}
.nota{color:var(--suave);margin:0 0 14px;font-size:.95rem}
.vacio{color:var(--suave);padding:30px;border:1px dashed var(--cian);border-radius:12px;text-align:center; background:rgba(0,243,255,0.05);}

/* ---------- Header flotante ---------- */
.barra{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:12px 20px;margin:0 -18px;
  background:rgba(5,7,20,0.85); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--cian); box-shadow: 0 4px 20px rgba(0,243,255,0.15);
}
.marca{font-size:1.6rem;font-weight:700; font-style:italic; letter-spacing: 1px;}
.marca span{color:var(--magenta);text-shadow:0 0 15px rgba(255,0,85,.8)}
.marca small{display:block;font-family:var(--cuerpo);font-weight:400;font-size:.75rem;color:var(--cian); font-style:normal; letter-spacing:0;}
.cuenta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.saldo{background:rgba(0,0,0,0.5);border:1px solid var(--ambar);border-radius:6px;padding:7px 15px;color:var(--ambar);transition:all .3s;}
.saldo strong{font-size:1.2rem; text-shadow:0 0 10px var(--ambar);}
.saldo.flash{box-shadow:0 0 24px rgba(255,234,0,.9); background:var(--ambar); color:#000; transform:scale(1.05);}

.chip{padding:6px 12px;border-radius:4px;border:1px solid var(--cian);color:var(--cian);font-size:.85rem;font-weight:700; text-transform:uppercase; background:rgba(0,243,255,0.1);}
.chip.auditor{border-color:var(--magenta);color:var(--magenta); background:rgba(255,0,85,0.1); box-shadow:0 0 10px rgba(255,0,85,0.4);}

select,input[type=text]{
  background:rgba(0,0,0,0.6);border:1px solid var(--cian);color:var(--cian);border-radius:6px;padding:9px 12px;font:inherit;
  outline:none; transition:0.3s; font-family:var(--display); font-weight:700; cursor:pointer;
}
select:hover, input[type=text]:focus { box-shadow:0 0 15px rgba(0,243,255,0.4); }
select option { background: var(--fondo); color:var(--texto); }

.btn-help {
  background: transparent; border: 1px solid var(--verde); color: var(--verde); border-radius: 50%;
  width: 36px; height: 36px; font-weight: bold; font-size: 1.2rem; cursor: pointer; transition: 0.3s;
  box-shadow: 0 0 10px rgba(0,255,136,0.3);
}
.btn-help:hover { background: var(--verde); color: #000; box-shadow: 0 0 20px rgba(0,255,136,0.8); transform:scale(1.1); }

/* ---------- Botones Cyberpunk ---------- */
button{font:inherit;cursor:pointer}
.btn{
  border:1px solid transparent;border-radius:4px;padding:12px 20px;font-weight:700;color:#000;
  background:var(--cian);box-shadow:0 0 15px rgba(0,243,255,.4);transition:all .2s ease-out;
  text-transform:uppercase; font-family:var(--display); letter-spacing:1px; position:relative; overflow:hidden;
}
.btn::before { content:''; position:absolute; top:0; left:-100%; width:50%; height:100%; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); transition:0.5s; }
.btn:hover::before { left:100%; }
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 0 25px rgba(0,243,255,.8); border-color:#fff;}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none; filter:grayscale(100%);}
.btn.rojo{background:var(--magenta);color:#fff;box-shadow:0 0 15px rgba(255,0,85,.5);}
.btn.rojo:hover:not(:disabled){box-shadow:0 0 25px rgba(255,0,85,.9);}
.btn.ambar{background:var(--ambar);box-shadow:0 0 15px rgba(255,234,0,.5); color:#000;}
.btn.grande{font-size:1.2rem;padding:15px 30px;}
.link{background:none;border:0;color:var(--cian);text-decoration:none;padding:6px 10px; transition:0.3s; border-bottom:1px dashed transparent;}
.link:hover{color:#fff; border-bottom:1px dashed var(--cian); text-shadow:0 0 8px var(--cian);}

/* ---------- Pestañas ---------- */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid rgba(0,243,255,0.3);margin:15px 0 20px;}
.tabs button{
  background:rgba(0,0,0,0.4);border:1px solid transparent; border-bottom:none; color:var(--suave);
  padding:12px 18px; border-radius:8px 8px 0 0; font-family:var(--display); text-transform:uppercase; transition:0.3s;
}
.tabs button:hover { background:rgba(0,243,255,0.1); color:#fff; }
.tabs button.on{color:var(--cian); background:var(--panel); border-color:var(--cian); border-bottom:2px solid var(--fondo); box-shadow:0 -4px 15px rgba(0,243,255,0.1);}

/* ---------- Tarjetas Hover Suave ---------- */
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{
  background:var(--panel);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:18px;
  display:flex;flex-direction:column;gap:8px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  transition:transform 0.3s, border-color 0.3s, box-shadow 0.3s; position:relative;
}
.card:hover { transform:translateY(-4px); border-color:var(--cian); box-shadow:0 8px 25px rgba(0,243,255,0.15); }
.card p{margin:0;color:var(--texto);font-size:.95rem;}
.card .meta{color:var(--ambar);font-size:.9rem; font-weight:bold; font-family:var(--display);}
.card .btn{margin-top:auto}

/* ---------- CCTV FOTO AUDITOR ---------- */
.card.foto{padding:0;overflow:hidden; border:2px solid #333;}
.card.foto:hover { border-color:var(--magenta); box-shadow:0 0 20px rgba(255,0,85,0.4); }
.card.foto img{width:100%;height:180px;object-fit:cover;display:block;background:#000; transition:transform 0.5s ease;}
.card.foto:hover img { transform:scale(1.1); opacity:0.8; }
.card.foto .cuerpo{padding:14px;display:flex;flex-direction:column;gap:8px; background:linear-gradient(0deg, var(--fondo), transparent); position:relative; z-index:2;}
.cctv-overlay { position:absolute; top:10px; right:10px; background:rgba(255,0,85,0.8); color:#fff; padding:2px 6px; font-size:0.7rem; font-weight:bold; letter-spacing:1px; z-index:3; border-radius:2px; animation:pulso 2s infinite; }
.watermark { position:absolute; bottom:55%; right:10px; color:rgba(255,255,255,0.5); font-family:monospace; font-size:0.8rem; z-index:3; text-shadow:1px 1px 2px #000; pointer-events:none;}

.card.sabot{border-color:var(--magenta); opacity:.8;}
.card.sabot:hover{border-color:var(--magenta); box-shadow:0 0 20px rgba(255,0,85,0.4);}
.card.gana{border-color:var(--verde);box-shadow:0 0 20px rgba(0,255,136,.3); background:rgba(0,255,136,0.05);}

.reloj{font-family:var(--display);font-size:2rem;color:var(--cian); text-shadow:0 0 10px var(--cian); text-align:center; padding:10px 0;}
.reloj.urgente{color:var(--magenta); text-shadow:0 0 15px var(--magenta); animation:pulso 1s infinite}
@keyframes pulso{50%{opacity:.4}}

.etiqueta{font-size:.85rem;font-weight:700;padding:4px 10px;border-radius:4px;display:inline-block;width:fit-content; text-transform:uppercase; letter-spacing:0.5px;}
.et-pend{background:rgba(255,234,0,.2);color:var(--ambar); border:1px solid var(--ambar);}
.et-ok{background:rgba(0,255,136,.2);color:var(--verde); border:1px solid var(--verde);}
.et-sab{background:rgba(255,0,85,.2);color:var(--magenta); border:1px solid var(--magenta);}

.banner{text-align:center;font-size:1.4rem;padding:15px;border-radius:6px;margin:15px 0;background:rgba(0,243,255,.1);border:1px solid var(--cian);color:var(--cian); text-transform:uppercase; letter-spacing:2px; text-shadow:0 0 8px var(--cian);}
.banner.auditor{background:rgba(255,0,85,.1);border-color:var(--magenta);color:var(--magenta); text-shadow:0 0 8px var(--magenta);}
.fila{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ---------- Lobby ---------- */
.entrada{max-width:700px;margin:40px auto;text-align:center; background:var(--panel); padding:30px; border-radius:12px; border:1px solid rgba(255,255,255,0.1); backdrop-filter:blur(10px);}
.entrada p{color:var(--texto); font-size:1.05rem;}
.asientos{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin:25px 0;text-align:left}
.asiento{background:rgba(0,0,0,0.5);border:1px dashed var(--suave);border-radius:8px;padding:16px;min-height:100px;color:var(--suave); transition:0.3s;}
.asiento.lleno{border-style:solid;border-color:rgba(0,243,255,0.5);color:var(--texto);box-shadow:inset 0 0 15px rgba(0,243,255,.05);}
.asiento.activo{border-color:var(--ambar);box-shadow:0 0 20px rgba(255,234,0,.2); background:rgba(255,234,0,0.05);}
.asiento .rol{font-size:.9rem;margin:6px 0 10px;color:var(--suave); text-transform:uppercase; font-family:var(--display);}
.asiento .rol.aud{color:var(--magenta);font-weight:700; text-shadow:0 0 8px var(--magenta);}
.asiento .rol.trab{color:var(--cian);font-weight:700; text-shadow:0 0 8px var(--cian);}

/* ---------- Modal y Animaciones Gamer ---------- */
.fondo-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(5px);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:#0a0c1a;border:2px solid var(--cian);border-radius:8px;padding:25px;max-width:480px;width:100%;animation:entra .4s cubic-bezier(.2,.9,.3,1.2); box-shadow:0 0 30px rgba(0,243,255,0.2); position:relative;}
.modal.glitch-modal { border-color:var(--magenta); box-shadow:0 0 40px rgba(255,0,85,0.4); animation:glitch-anim 0.4s ease-out; }
.modal.shield-modal { border-color:var(--verde); box-shadow:0 0 40px rgba(0,255,136,0.3); }

@keyframes glitch-anim {
  0% { transform: scale(0.9) translate(5px, 5px); filter: hue-rotate(90deg); }
  20% { transform: scale(1.05) translate(-5px, -5px); filter: contrast(200%); }
  40% { transform: scale(0.95) translate(5px, -5px); }
  100% { transform: scale(1) translate(0); }
}
@keyframes entra{from{transform:scale(.8) translateY(20px);opacity:0}to{transform:none;opacity:1}}

.modal img{width:100%;border-radius:6px;margin:12px 0;display:block; border:1px solid #333;}
.revela{text-align:center}
.revela h1{font-size:clamp(2.5rem,8vw,3.5rem);color:var(--verde);text-shadow:0 0 20px var(--verde); margin-bottom:5px;}
.revela.aud h1{color:var(--magenta);text-shadow:0 0 20px var(--magenta); font-family:monospace; letter-spacing: -2px;}
.glitch-text { position:relative; display:inline-block; }
.glitch-text::before, .glitch-text::after { content:attr(data-text); position:absolute; top:0; left:0; width:100%; height:100%; opacity:0.8; }
.glitch-text::before { left:2px; text-shadow:-2px 0 var(--cian); animation:glitch-bot 2s infinite linear alternate-reverse; }
.glitch-text::after { left:-2px; text-shadow:2px 0 var(--ambar); animation:glitch-bot 3s infinite linear alternate-reverse; }
@keyframes glitch-bot { 0% { clip-path: inset(20% 0 80% 0); } 20% { clip-path: inset(60% 0 10% 0); } 100% { clip-path: inset(10% 0 40% 0); } }

/* ---------- Ruleta ---------- */
.centro{text-align:center}
.ruleta-wrap{position:relative;width:320px;height:320px;margin:40px auto}
.puntero{position:absolute;top:-20px;left:50%;margin-left:-15px;border:15px solid transparent;border-top:30px solid #fff;z-index:2;filter:drop-shadow(0 0 10px var(--ambar))}
.rueda{
  position:absolute;inset:0;border-radius:50%;border:6px solid var(--panel2);
  background:conic-gradient(#ff0055 0 72deg, #1d2a6e 72deg 144deg, #00f3ff 144deg 216deg, #ffea00 216deg 288deg, #00ff88 288deg 360deg);
  box-shadow:0 0 50px rgba(0,243,255,.2),inset 0 0 40px rgba(0,0,0,.6); transition:transform 4s cubic-bezier(0.1, 0.9, 0.2, 1);
}
.sector{position:absolute;left:50%;top:50%;width:70px;height:30px;margin:-15px 0 0 -35px;font-family:var(--display);font-weight:900;font-size:1.5rem;color:#fff;text-shadow:2px 2px 0 #000, 0 0 10px rgba(255,255,255,0.5)}
.resultado{margin:30px auto 0;max-width:400px;padding:20px;border-radius:8px;background:var(--panel);border:2px solid var(--verde);display:flex;flex-direction:column;gap:5px;animation:entra .5s both}
.resultado strong{font-size:2.8rem;color:var(--verde); text-shadow:0 0 15px var(--verde);}
.resultado.pierde{border-color:var(--magenta)} .resultado.pierde strong{color:var(--magenta); text-shadow:0 0 15px var(--magenta);}
.resultado.jackpot{border-color:var(--ambar);box-shadow:0 0 40px rgba(255,234,0,.4); background:rgba(255,234,0,0.1);} .resultado.jackpot strong{color:var(--ambar);font-size:3.2rem;}

/* ---------- Subasta / Impacto ODS ---------- */
.puja{font-family:var(--display);font-size:2.5rem;color:var(--ambar)!important; text-shadow:0 0 10px rgba(255,234,0,0.5); margin:5px 0;}
.cierre{font-family:var(--display);font-size:1.8rem;color:var(--magenta); text-shadow:0 0 10px var(--magenta);}
.metricas{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin:20px 0}
.metrica{background:var(--panel);border:1px solid var(--linea);border-radius:8px;padding:25px; text-align:center; position:relative; overflow:hidden;}
.metrica::after { content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%; background:radial-gradient(circle, rgba(0,243,255,0.1) 0%, transparent 60%); pointer-events:none;}
.metrica strong{display:block;font-size:clamp(2.2rem,5vw,3.2rem);color:var(--verde);text-shadow:0 0 20px rgba(0,255,136,.5);overflow-wrap:anywhere; font-family:var(--display);}
.metrica span{color:var(--texto); font-size:1.1rem; text-transform:uppercase; letter-spacing:1px; margin-top:5px; display:block;}

/* Gráfico CREG */
.grafico-creg { background:rgba(0,0,0,0.4); padding:20px; border-radius:8px; border:1px solid var(--cian); margin:20px 0; }
.barra-wrap { width:100%; background:#222; height:30px; border-radius:15px; margin:15px 0; overflow:hidden; position:relative; border:1px solid #444;}
.barra-llena { height:100%; background:linear-gradient(90deg, var(--cian), var(--verde)); transition:width 1.5s ease-out; width:0%; display:flex; align-items:center; justify-content:flex-end; padding-right:10px; color:#000; font-weight:bold;}
.meta-linea { position:absolute; left:90%; top:0; height:100%; border-left:3px dashed var(--ambar); z-index:2;}
.meta-texto { position:absolute; left:90%; top:-25px; transform:translateX(-50%); color:var(--ambar); font-size:0.8rem; font-weight:bold;}

.ods{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px;margin:20px 0}
.ods div{background:rgba(27,32,72,0.6);border-left:4px solid var(--ambar);padding:18px;border-radius:0 8px 8px 0;color:var(--texto); border-top:1px solid rgba(255,255,255,0.05); border-bottom:1px solid rgba(255,255,255,0.05); border-right:1px solid rgba(255,255,255,0.05);}
.ods b{color:var(--ambar);display:block;margin-bottom:8px;font-family:var(--display); font-size:1.1rem;}

/* ---------- Avisos, Efectos y Confeti ---------- */
#toasts{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:10px;width:min(90vw,480px)}
.toast{padding:14px 20px;border-radius:6px;background:rgba(0,255,136,0.1);border:1px solid var(--verde);color:var(--verde);backdrop-filter:blur(10px); animation:entra .3s both; font-weight:bold; text-align:center; box-shadow:0 5px 15px rgba(0,0,0,0.5);}
.toast.error{background:rgba(255,0,85,0.1);border-color:var(--magenta);color:#ffb3c6; text-shadow:0 0 5px var(--magenta);}
.flota{position:fixed;z-index:90;font-family:var(--display);font-size:2.5rem;font-weight:900;pointer-events:none;animation:sube 2s ease-out forwards;text-shadow:0 4px 15px currentColor}
@keyframes sube{from{transform:translate(-50%, 0) scale(0.8);opacity:1}to{transform:translate(-50%, -120px) scale(1.2);opacity:0}}

.confeti { position:fixed; z-index:9999; animation: cae linear forwards; top:-10px; }
@keyframes cae { 
  0% { transform: translateY(0) rotate(0deg); opacity:1;} 
  100% { transform: translateY(100vh) rotate(720deg); opacity:0;} 
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--fondo); }
::-webkit-scrollbar-thumb { background: var(--cian); border-radius: 4px; }
</style>

<body>
<div class="wrap">
  <div id="cabecera"></div>
  <div id="vista"></div>
</div>
<div id="modal"></div>
<div id="toasts"></div>

<script>
/* ============================================================
   AUDIO GAMER (Web Audio API) - Sin archivos externos
   ============================================================ */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let audioInit = false;

function initAudio() {
  if(!audioInit && audioCtx.state === 'suspended') { audioCtx.resume(); audioInit = true; }
}
function playTone(freq, type, duration, vol, delay=0) {
  if(audioCtx.state === 'suspended') return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime + delay);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + delay + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(audioCtx.currentTime + delay); osc.stop(audioCtx.currentTime + delay + duration);
}
const FX = {
  coin: () => { playTone(988, 'square', 0.1, 0.05); playTone(1318, 'square', 0.2, 0.05, 0.1); },
  alarm: () => { for(let i=0;i<4;i++){ playTone(300, 'sawtooth', 0.2, 0.1, i*0.4); playTone(400, 'sawtooth', 0.2, 0.1, i*0.4+0.2); } },
  win: () => { [523,659,784,1046,1318].forEach((f,i)=>playTone(f,'square',0.15,0.08,i*0.1)); },
  spinClick: () => { playTone(800, 'sine', 0.05, 0.02); },
  fail: () => { playTone(200, 'sawtooth', 0.3, 0.1); playTone(150, 'sawtooth', 0.4, 0.1, 0.3); }
};

function fireConfetti() {
  const colors = ['#00f3ff','#ff0055','#ffea00','#00ff88'];
  for(let i=0;i<80;i++){
    let c = document.createElement('div');
    c.className = 'confeti';
    c.style.left = Math.random()*100 + 'vw';
    c.style.width = (Math.random()*8 + 5) + 'px';
    c.style.height = (Math.random()*15 + 5) + 'px';
    c.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration = (Math.random()*2 + 2) + 's';
    c.style.animationDelay = (Math.random()*0.5) + 's';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 4000);
  }
}

/* ============================================================
   2. CONFIGURACIÓN DEL JUEGO
   ============================================================ */
const KEY = 'ecosabotage_v2';
const CFG = {
  EMPRESA: 'OptimaTech', MAX_JUGADORES: 6, SALDO_INICIAL: 200, COSTO_RULETA: 50, PENALIZACION: 100, INCREMENTO_PUJA: 50,
  SUBASTA_MIN: 10, COP_POR_KWH: 800, KG_CO2_POR_KWH: 0.126, KG_CO2_POR_ARBOL_ANIO: 22
};

const TAREAS = [

function toast(msg, tipo){
  const d = document.createElement('div'); d.className = 'toast'+(tipo==='error'?' error':''); d.textContent = msg;

}
function popup(texto, color){

}

function estadoDe(h){
  if(h.reportada) return h.estado;

function calcImpacto(){
  const validas = S.hechas.filter(h => estadoDe(h)!=='SABOTEADA');
  const kwh = validas.reduce((a,h)=>a+h.kwh,0);
  return {kwh, cop:kwh*CFG.COP_POR_KWH, co2:kwh*CFG.KG_CO2_POR_KWH, arboles:kwh*CFG.KG_CO2_POR_KWH/CFG.KG_CO2_POR_ARBOL_ANIO,
          validas:validas.length, sab:S.hechas.length-validas.length};
}

function animarContadores(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const fin = parseFloat(el.dataset.count), dec = +el.dataset.dec, pre = el.dataset.pre||'', t0 = performance.now();
    (function paso(t){
      const k = Math.min(1,(t-t0)/1200), v = fin*(1-Math.pow(1-k,3));
      el.textContent = pre + v.toLocaleString('es-CO',{minimumFractionDigits:dec,maximumFractionDigits:dec});
      if(k<1) requestAnimationFrame(paso); else el.textContent = pre + fin.toLocaleString('es-CO',{minimumFractionDigits:dec,maximumFractionDigits:dec});
    })(t0);
  });
  // Animar barra CREG
  setTimeout(() => {
    const barra = $('.barra-llena');
    if(barra) barra.style.width = barra.style.width; // Triggers transition if was 0
  }, 100);
}

          <strong style="color:var(--cian); font-size:1.2rem;">PASO 1: Misiones y Hamons 🪙</strong><br>
          Completa tareas reales de ahorro de energía. Sube tu foto de prueba y mina Hamons (moneda virtual) aleatorios.
        </div>
        <div style="background:rgba(255,0,85,0.1); padding:15px; border-left:3px solid var(--magenta); border-radius:4px;">
          <strong style="color:var(--magenta); font-size:1.2rem;">PASO 2: Cuidado con el Auditor ⚠</strong><br>
          Uno de ustedes es el Auditor (Impostor). Tiene 15 min para vigilar tus fotos. Si subes una foto falsa, te saboteará y robará tus fondos.
        </div>
        <div style="background:rgba(255,234,0,0.1); padding:15px; border-left:3px solid var(--ambar); border-radius:4px;">
          <strong style="color:var(--ambar); font-size:1.2rem;">PASO 3: Recompensas Reales 🎁</strong><br>
          Multiplica tus Hamons en la Ruleta y úsalos en el Mercado (Subastas) para ganar premios físicos corporativos.
        </div>
      </div>
      <button class="btn grande" style="width:100%" data-a="cerrarModal">ENTENDIDO</button>
    `, 'shield-modal');
  },

  unirse(){
    initAudio();
    const inp = $('#nombre'); const name = (inp.value||'').trim();
    if(!name) return toast('Protocolo de nombre vacío. Ingresa un alias.','error');
    if(S.players.some(p=>p.name.toLowerCase()===name.toLowerCase())) return toast('Alias duplicado en la red.','error');
    S.players.push({name, rol:null, saldo:CFG.SALDO_INICIAL, visto:false});
    if(!S.activo) S.activo = name;
    if(S.players.length>=CFG.MAX_JUGADORES) asignarRoles();
    guardar(); render(); if(S.roles) revelarRol();
  },
  autollenar(){ initAudio(); ['Cypher','Nova','Glitch','Neo','Trinity','Link'].forEach(n=>{
      if(S.players.length<CFG.MAX_JUGADORES && !S.players.some(p=>p.name===n)) S.players.push({name:n, rol:null, saldo:CFG.SALDO_INICIAL, visto:false});
    });
    if(!S.activo) S.activo = S.players[0].name;
    if(S.players.length>=CFG.MAX_JUGADORES) asignarRoles();
    guardar(); render(); if(S.roles) revelarRol();
  },
  iniciar(){ initAudio(); if(S.players.length<2) return; asignarRoles(); guardar(); render(); revelarRol(); },
  jugarComo(d){ S.activo = d.n; guardar(); render(); revelarRol(); },
  entendido(){ const p=yo(); if(p) p.visto = true; guardar(); cerrarModal(); vista='juego'; render(); },
  reiniciar(){ if(confirm('¿Purgar base de datos y reiniciar la partida?')){ localStorage.removeItem(KEY); location.reload(); } },

  abrirTarea(d){
    const t = TAREAS.find(x=>x.id==d.id); tareaModal = t; fotoSubida = null;
    modalHtml(`
      <h3 style="color:var(--cian); margin-top:0;">${t.titulo}</h3>
      <p class="nota">Recompensa Estimada: 🪙 ${t.min}–${t.max} H</p>
      <div style="background:rgba(0,0,0,0.4); padding:15px; border-radius:6px; border:1px solid #333; margin-bottom:15px;">
        <label class="nota" style="color:#fff; display:block; margin-bottom:10px;">Subir Evidencia (Foto):</label>
        <input type="file" id="archivo" accept="image/*" data-change="archivo" style="width:100%; border:none; padding:0; background:transparent;">
        <div id="prev" style="margin-top:10px;"><p class="nota" style="font-size:0.8rem;">[ Sin evidencia - Se generará simulación ]</p></div>
      </div>
      <label class="fila nota" style="cursor:pointer; background:rgba(255,0,85,0.1); padding:10px; border-radius:4px; border:1px dashed var(--magenta); color:#fff;">
        <input type="checkbox" id="chkFalsa" style="transform:scale(1.2);"> Inyectar Evidencia Falsa (Para probar al Auditor)
      </label>
      <div class="fila" style="margin-top:20px; justify-content:space-between;">
        <button class="link" style="color:var(--suave)" data-a="cerrarModal">Cancelar</button>
        <button class="btn grande" data-a="enviarPrueba">TRANSMITIR REPORTE</button>
      </div>`);
  },
  cerrarModal(){ cerrarModal(); },
  enviarPrueba(){
    const p = yo(), t = tareaModal; if(!p||!t) return;
    const falsa = $('#chkFalsa').checked;
    const ganados = rnd(t.min, t.max);
    S.hechas.unshift({id:S.nextId++, user:p.name, tid:t.id, titulo:t.titulo, kwh:t.kwh, hamons:ganados,
      foto: fotoSubida || fotoSim(t.titulo, falsa), falsa, ts:Date.now(), reportada:false, estado:'PENDIENTE'});
    p.saldo += ganados;
    FX.coin();
    guardar(); cerrarModal(); render(); flashSaldo(); popup('+'+ganados+' 🪙');
  },

  reportar(d){
    const aud = yo(), h = S.hechas.find(x=>x.id==d.id);
    if(!aud||!h) return;
    if(estadoDe(h)!=='PENDIENTE') return toast('Ventana de CCTV expirada.','error');
    h.reportada = true;
    if(h.falsa){
      const trab = S.players.find(p=>p.name===h.user);
      const robo = Math.min(h.hamons, trab.saldo);
      trab.saldo -= robo; aud.saldo += robo; h.estado = 'SABOTEADA';
      FX.alarm();
      toast(`SABOTAJE EXITOSO: Robaste 🪙 ${robo} a ${trab.name}.`); popup('+'+robo+' 🪙','var(--magenta)');
    } else {
      aud.saldo = Math.max(0, aud.saldo - CFG.PENALIZACION); h.estado = 'VERIFICADA';
      FX.fail();
      toast(`FALLO DE SISTEMA: Evidencia válida. Penalización: -${CFG.PENALIZACION} 🪙`,'error'); popup('-'+CFG.PENALIZACION,'var(--magenta)');
    }
    guardar(); render(); flashSaldo();
  },

  girar(){
    const p = yo(); if(!p||girando) return;
    if(p.saldo < CFG.COSTO_RULETA) return toast('Fondos insuficientes (🪙 '+CFG.COSTO_RULETA+' req).','error');
    p.saldo -= CFG.COSTO_RULETA;
    
    let tot = RULETA.reduce((a,r)=>a+r[1],0), x = Math.random()*tot, mult = 0;
    for(const [m,w] of RULETA){ if((x-=w)<0){ mult=m; break; } }
    const premio = Math.floor(CFG.COSTO_RULETA*mult);
    
    const idx = SECTORES.indexOf(mult);
    const destino = rotacion - (rotacion%360) + 360*8 + (360-(idx*72+36));
    girando = true; ultimoResultado = null; guardar(); render();
    const rueda = $('#rueda'); rueda.getBoundingClientRect();
    rotacion = destino;
    rueda.style.transform = `rotate(${destino}deg)`;
    
    // Sonido de giro
    let ticks = 0;
    let spinInterval = setInterval(()=>{ FX.spinClick(); ticks++; if(ticks>15) clearInterval(spinInterval); }, 200);

    setTimeout(()=>{
      p.saldo += premio; girando = false; ultimoResultado = {mult, premio};
      
      if(mult >= 3) { FX.win(); if(mult === 5) fireConfetti(); }
      else if (mult === 0) FX.fail();
      else FX.coin();

      guardar(); render(); flashSaldo();
      popup(premio>0?'+'+premio+' 🪙':'x0', premio>0?'var(--verde)':'var(--magenta)');
    }, 4000); // Coincide con la transición CSS de 4s
  },

  pujar(d){
    const p = yo(), pr = S.premios.find(x=>x.id==d.id);
    if(!p||!pr) return;
    if(!subastaAbierta()) return toast('Mercado cerrado.','error');
    const monto = pr.alta ? pr.alta + CFG.INCREMENTO_PUJA : pr.base;
    if(pr.ganador===p.name) return toast('Ya lideras esta oferta.','error');
    if(p.saldo < monto) return toast('Fondos insuficientes (🪙 '+nf(monto)+').','error');
    if(pr.ganador){ const ant = S.players.find(x=>x.name===pr.ganador); if(ant) ant.saldo += pr.alta; }
    p.saldo -= monto; pr.alta = monto; pr.ganador = p.name;
    FX.coin();
    guardar(); render(); flashSaldo(); toast('Liderando oferta: '+pr.titulo);
  },
  cerrarSubasta(){ 
    S.subastaCerrada = true; guardar(); render(); toast('Mercado Subastas Cerrado.'); 
    FX.win(); fireConfetti();
  },

  verImpacto(){ impactoVisible = true; render(); },
  semanaSim(){
    S.players.filter(p=>p.rol==='TRABAJADOR').forEach(p=>{
      for(let i=0;i<4;i++){
        const t = TAREAS[rnd(0,TAREAS.length-1)], g = rnd(t.min,t.max);
        S.hechas.push({id:S.nextId++, user:p.name, tid:t.id, titulo:t.titulo, kwh:t.kwh, hamons:g, foto:fotoSim(t.titulo,false),
          falsa:false, ts:Date.now()-ventanaMs()-rnd(60000,3600000), reportada:false, estado:'VERIFICADA'});
        p.saldo += g;
      }
    });
    impactoVisible = true; guardar(); render(); toast('Tráfico Simulado Inyectado.');
  }
};

function asignarRoles(){
  const idx = S.players.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){ const j=rnd(0,i); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  S.players.forEach((p,i)=>{ p.rol = (i===idx[0]) ? 'AUDITOR' : 'TRABAJADOR'; p.visto = false; });
  S.roles = true; vista = 'juego';
  S.subastaFin = Date.now() + CFG.SUBASTA_MIN*60000;
}

/* ============================================================
   7. EVENTOS Y RELOJ
   ============================================================ */
document.addEventListener('click', e=>{
  if(!audioInit) initAudio();
  const b = e.target.closest('[data-a]'); if(!b || b.disabled) return;
  const f = A[b.dataset.a]; if(f) f(b.dataset);
});
document.addEventListener('keydown', e=>{
  if(!audioInit) initAudio();
  if(e.key==='Enter' && e.target.dataset && e.target.dataset.enter) A[e.target.dataset.enter]();
});
document.addEventListener('change', e=>{
  const k = e.target.dataset && e.target.dataset.change; if(!k) return;
  if(k==='cambiar'){ S.activo = e.target.value; guardar(); render(); revelarRol(); }
  if(k==='mostrarRoles'){ S.mostrarRoles = e.target.checked; guardar(); render(); }
  if(k==='ventana'){ S.ventanaMin = +e.target.value; guardar(); render(); }
  if(k==='archivo'){
    const file = e.target.files[0]; if(!file) return;
    const rd = new FileReader();
    rd.onload = () => { const img = new Image(); img.onload = () => {
      const w = 400, h = Math.round(img.height*w/img.width), c = document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h); fotoSubida = c.toDataURL('image/jpeg',.7);
      $('#prev').innerHTML = `<img src="${fotoSubida}" alt="Previa" style="width:100%; border-radius:4px; margin-top:10px; border:1px solid var(--cian);">`;
    }; img.src = rd.result; };
    rd.readAsDataURL(file);
  }
});
window.addEventListener('storage', e=>{ if(e.key===KEY){ S = cargar(); if(!girando) render(); } });

setInterval(()=>{
  let redibujar = false;
  document.querySelectorAll('[data-ts]').forEach(el=>{
    const rest = Math.max(0, Math.ceil((+el.dataset.ts + ventanaMs() - Date.now())/1000));
    el.textContent = fmt(rest); el.classList.toggle('urgente', rest<60);
    if(rest===0) redibujar = true;
  });
  const f = document.querySelector('[data-fin]');
  if(f){
    const rest = Math.max(0, Math.ceil((+f.dataset.fin - Date.now())/1000));
    f.textContent = `Cierre en: ${fmt(rest)}`;
    if(rest===0){ S.subastaCerrada = true; guardar(); redibujar = true; fireConfetti(); FX.win(); }
  }
  if(redibujar && !girando) render();
}, 1000);

render();
if(S.roles) revelarRol();
</script>
</body>
</html>
