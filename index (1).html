<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoSabotage · Barranquilla No Se Apaga</title>
<!--
  ECOSABOTAGE - Hackathon "Barranquilla No Se Apaga" (Línea 2: EcoFriends)
  Un solo archivo: doble clic y funciona. Sin servidor, sin instalación.
  Estado guardado en localStorage (JSON). Si abres varias pestañas, se sincronizan entre sí.
  Licencia MIT.
-->
<style>
/* ============================================================
   1. TEMA OSCURO / NEÓN (variables fáciles de cambiar)
   ============================================================ */
:root{
  --fondo:#090b1c; --panel:#131736; --panel2:#1b2048; --linea:#2a3070;
  --texto:#e9ecff; --suave:#9aa2d6;
  --cian:#2de2ff; --magenta:#ff3d8b; --ambar:#ffc83d; --verde:#3dffa5;
  --display:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --cuerpo:'DM Sans','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; color:var(--texto); font-family:var(--cuerpo);
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(255,61,139,.16), transparent 60%),
    radial-gradient(800px 500px at -10% 10%, rgba(45,226,255,.14), transparent 60%),
    var(--fondo);
  background-attachment:fixed;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 70px}
h1,h2,h3,strong,.marca,.banner{font-family:var(--display)}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;margin:0 0 12px}
h2{font-size:1.55rem;margin:22px 0 6px}
h3{margin:0 0 6px;font-size:1.1rem}
p{line-height:1.5}
.nota{color:var(--suave);margin:0 0 14px;font-size:.95rem}
.vacio{color:var(--suave);padding:26px;border:1px dashed var(--linea);border-radius:12px;text-align:center}

/* ---------- Header flotante ---------- */
.barra{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:12px 18px;margin:0 -18px;background:rgba(9,11,28,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--linea)}
.marca{font-size:1.5rem;font-weight:700}
.marca span{color:var(--cian);text-shadow:0 0 18px rgba(45,226,255,.7)}
.marca small{display:block;font-family:var(--cuerpo);font-weight:400;font-size:.72rem;color:var(--suave)}
.cuenta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.saldo{background:var(--panel);border:1px solid var(--linea);border-radius:999px;padding:7px 15px;color:var(--ambar);transition:box-shadow .3s}
.saldo strong{font-size:1.15rem}
.saldo.flash{box-shadow:0 0 24px rgba(255,200,61,.7)}
.chip{padding:6px 12px;border-radius:8px;border:1px solid var(--cian);color:var(--cian);font-size:.85rem;font-weight:700}
.chip.auditor{border-color:var(--magenta);color:var(--magenta)}
select,input[type=text]{background:var(--panel);border:1px solid var(--linea);color:var(--texto);border-radius:10px;padding:9px 12px;font:inherit}

/* ---------- Botones ---------- */
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ambar);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;color:#04121a;background:var(--cian);box-shadow:0 0 18px rgba(45,226,255,.35);transition:transform .12s,box-shadow .12s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 0 28px rgba(45,226,255,.65)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.rojo{background:var(--magenta);color:#fff;box-shadow:0 0 18px rgba(255,61,139,.45);width:100%}
.btn.ambar{background:var(--ambar);box-shadow:0 0 18px rgba(255,200,61,.4)}
.btn.grande{font-size:1.1rem;padding:14px 28px}
.link{background:none;border:0;color:var(--suave);text-decoration:underline;padding:4px 6px}
.link:hover{color:var(--texto)}

/* ---------- Pestañas ---------- */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--linea);margin:8px 0}
.tabs button{background:none;border:0;color:var(--suave);padding:12px 14px;border-bottom:3px solid transparent}
.tabs button.on{color:var(--texto);border-bottom-color:var(--cian)}

/* ---------- Tarjetas ---------- */
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--linea);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.card p{margin:0;color:var(--suave);font-size:.93rem}
.card .meta{color:var(--ambar);font-size:.86rem}
.card .btn{margin-top:auto}
.card.foto{padding:0;overflow:hidden}
.card.foto img{width:100%;height:160px;object-fit:cover;display:block;background:var(--panel2)}
.card.foto .cuerpo{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.card.sabot{border-color:var(--magenta);opacity:.75}
.card.gana{border-color:var(--verde);box-shadow:0 0 20px rgba(61,255,165,.25)}
.reloj{font-family:var(--display);font-size:1.8rem;color:var(--cian)}
.reloj.urgente{color:var(--magenta);animation:pulso 1s infinite}
@keyframes pulso{50%{opacity:.4}}
.etiqueta{font-size:.82rem;font-weight:700;padding:3px 9px;border-radius:6px;display:inline-block;width:fit-content}
.et-pend{background:rgba(255,200,61,.15);color:var(--ambar)}
.et-ok{background:rgba(61,255,165,.15);color:var(--verde)}
.et-sab{background:rgba(255,61,139,.18);color:#ff9cc3}

.banner{text-align:center;font-size:1.25rem;padding:13px;border-radius:12px;margin:12px 0;background:rgba(45,226,255,.1);border:1px solid var(--cian);color:var(--cian)}
.banner.auditor{background:rgba(255,61,139,.1);border-color:var(--magenta);color:var(--magenta)}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- Lobby ---------- */
.entrada{max-width:680px;margin:30px auto;text-align:center}
.entrada p{color:var(--suave)}
.asientos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:22px 0;text-align:left}
.asiento{background:var(--panel);border:1px dashed var(--linea);border-radius:12px;padding:14px;min-height:92px;color:var(--suave)}
.asiento.lleno{border-style:solid;border-color:var(--cian);color:var(--texto);box-shadow:0 0 14px rgba(45,226,255,.2)}
.asiento.activo{border-color:var(--ambar);box-shadow:0 0 18px rgba(255,200,61,.35)}
.asiento .rol{font-size:.85rem;margin:4px 0 8px;color:var(--suave)}
.asiento .rol.aud{color:var(--magenta);font-weight:700}
.asiento .rol.trab{color:var(--cian);font-weight:700}

/* ---------- Modal ---------- */
.fondo-modal{position:fixed;inset:0;background:rgba(4,5,14,.8);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--linea);border-radius:16px;padding:22px;max-width:440px;width:100%;animation:entra .35s cubic-bezier(.2,.9,.3,1.2)}
.modal img{width:100%;border-radius:10px;margin:10px 0;display:block}
.revela{text-align:center}
.revela h1{font-size:clamp(2rem,8vw,3.4rem);color:var(--cian);text-shadow:0 0 36px rgba(45,226,255,.8)}
.revela.aud h1{color:var(--magenta);text-shadow:0 0 36px rgba(255,61,139,.85)}
@keyframes entra{from{transform:scale(.7);opacity:0;filter:blur(8px)}to{transform:none;opacity:1;filter:none}}

/* ---------- Ruleta ---------- */
.centro{text-align:center}
.ruleta-wrap{position:relative;width:290px;height:290px;margin:26px auto}
.puntero{position:absolute;top:-14px;left:50%;margin-left:-12px;border:12px solid transparent;border-top:24px solid var(--ambar);z-index:2;filter:drop-shadow(0 0 8px var(--ambar))}
.rueda{position:absolute;inset:0;border-radius:50%;border:4px solid var(--ambar);
  background:conic-gradient(#5b1030 0 72deg,#1d2a6e 72deg 144deg,#0f6b78 144deg 216deg,#6b4d00 216deg 288deg,#8a1c8c 288deg 360deg);
  box-shadow:0 0 40px rgba(255,200,61,.35),inset 0 0 40px rgba(0,0,0,.5)}
.rueda.gira{transition:transform 3.5s cubic-bezier(.12,.7,.1,1)}
.sector{position:absolute;left:50%;top:50%;width:64px;height:28px;margin:-14px 0 0 -32px;font-family:var(--display);font-weight:700;font-size:1.25rem;color:#fff;text-shadow:0 0 8px #000}
.resultado{margin:22px auto 0;max-width:360px;padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--cian);display:flex;flex-direction:column;gap:4px;animation:entra .5s both}
.resultado strong{font-size:2.2rem;color:var(--verde)}
.resultado.pierde{border-color:var(--magenta)} .resultado.pierde strong{color:var(--magenta)}
.resultado.jackpot{border-color:var(--ambar);box-shadow:0 0 44px rgba(255,200,61,.65)} .resultado.jackpot strong{color:var(--ambar);font-size:2.8rem}

/* ---------- Subasta / Impacto ---------- */
.puja{font-family:var(--display);font-size:2.1rem;color:var(--ambar)!important}
.cierre{font-family:var(--display);font-size:1.4rem;color:var(--cian)}
.metricas{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:18px 0}
.metrica{background:var(--panel);border:1px solid var(--linea);border-radius:16px;padding:22px}
.metrica strong{display:block;font-size:clamp(2rem,5vw,2.9rem);color:var(--verde);text-shadow:0 0 22px rgba(61,255,165,.35);overflow-wrap:anywhere}
.metrica span{color:var(--suave)}
.ods{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin:16px 0}
.ods div{background:var(--panel2);border-left:4px solid var(--ambar);padding:14px 16px;border-radius:8px;color:var(--suave)}
.ods b{color:var(--ambar);display:block;margin-bottom:4px;font-family:var(--display)}

/* ---------- Avisos y efectos ---------- */
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;width:min(92vw,460px)}
.toast{padding:11px 15px;border-radius:10px;background:#0f2a22;border:1px solid var(--verde);color:var(--verde);animation:entra .3s both}
.toast.error{background:#2d0f1e;border-color:var(--magenta);color:#ff9cc3}
.flota{position:fixed;z-index:90;font-family:var(--display);font-size:2rem;font-weight:700;pointer-events:none;animation:sube 1.8s ease-out forwards;text-shadow:0 0 14px currentColor}
@keyframes sube{from{transform:translateY(0);opacity:1}to{transform:translateY(-90px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="wrap">
  <div id="cabecera"></div>   <!-- header flotante -->
  <div id="vista"></div>      <!-- contenido principal -->
</div>
<div id="modal"></div>
<div id="toasts"></div>

<script>
/* ============================================================
   2. CONFIGURACIÓN DEL JUEGO (ajusta aquí los números)
   ============================================================ */
const KEY = 'ecosabotage_v1';
const CFG = {
  EMPRESA: 'OptimaTech',
  MAX_JUGADORES: 6,
  SALDO_INICIAL: 200,
  COSTO_RULETA: 50,
  PENALIZACION: 100,          // castigo al Auditor por acusación falsa
  INCREMENTO_PUJA: 50,
  SUBASTA_MIN: 10,            // minutos que dura la subasta desde que empieza la partida
  COP_POR_KWH: 800,           // ESTIMATIVO: reemplazar con la tarifa real de la factura
  KG_CO2_POR_KWH: 0.126,      // ESTIMATIVO: factor de emisión de la red eléctrica
  KG_CO2_POR_ARBOL_ANIO: 22   // ESTIMATIVO: CO2 que absorbe un árbol al año
};

// Tareas de ahorro: rango de Hamons aleatorio + kWh ahorrados estimados
const TAREAS = [
  {id:1, titulo:'Ajustar aire a 24°C',     desc:'Deja el aire acondicionado entre 24 y 26 °C.',        min:80, max:180, kwh:1.8},
  {id:2, titulo:'Desconectar regletas',    desc:'Apaga regletas y cargadores en standby.',             min:40, max:100, kwh:0.9},
  {id:3, titulo:'Apagar luces al salir',   desc:'Apaga las luces de salas y oficinas vacías.',         min:30, max:80,  kwh:0.6},
  {id:4, titulo:'Pantalla en modo ahorro', desc:'Activa suspensión automática del monitor.',           min:20, max:60,  kwh:0.4},
  {id:5, titulo:'Aprovechar luz natural',  desc:'Abre persianas y apaga lámparas en horas de sol.',    min:50, max:120, kwh:1.1}
];

// Ruleta: [multiplicador, peso]. Retorno esperado ~0.93 (la casa gana un poco).
const RULETA = [[0,35],[0.5,30],[1.5,22],[3,10],[5,3]];
const SECTORES = RULETA.map(r => r[0]);   // orden de los 5 sectores de la rueda (72° cada uno)

/* ============================================================
   3. ESTADO (JSON en localStorage; si falla, queda en memoria)
   ============================================================ */
function estadoNuevo(){
  return {
    players: [],            // {name, rol, saldo, visto}
    roles: false,           // true cuando ya se asignaron los roles
    activo: null,           // nombre del jugador que estamos "usando" en esta pantalla
    mostrarRoles: false,    // interruptor de demo: ver roles de todos
    hechas: [],             // tareas completadas
    premios: [
      {id:1, titulo:'Medio día libre',   base:400, alta:0, ganador:null},
      {id:2, titulo:'Bono de almuerzo',  base:150, alta:0, ganador:null},
      {id:3, titulo:'Parqueo VIP',       base:250, alta:0, ganador:null}
    ],
    subastaFin: null, subastaCerrada: false,
    ventanaMin: 15,         // ventana de auditoría en minutos (1 = demo rápida)
    nextId: 1
  };
}
function cargar(){
  try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){}
  return estadoNuevo();
}
function guardar(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('No se pudo guardar (almacenamiento lleno o bloqueado). La demo sigue en memoria.','error'); }
}
let S = cargar();
let vista = 'lobby';          // lobby | juego | ruleta | subasta | impacto
let impactoVisible = false;
let rotacion = 0, girando = false, ultimoResultado = null;
let tareaModal = null, fotoSubida = null;

/* ============================================================
   4. UTILIDADES
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const nf = n => Number(n).toLocaleString('es-CO');
const fmt = seg => String(Math.floor(seg/60)).padStart(2,'0')+':'+String(seg%60).padStart(2,'0');
const yo = () => S.players.find(p => p.name === S.activo);
const ventanaMs = () => S.ventanaMin*60000;
const hora = ts => new Date(ts).toLocaleTimeString('es-CO');
const subastaAbierta = () => S.roles && !S.subastaCerrada && Date.now() < S.subastaFin;

function toast(msg, tipo){
  const d = document.createElement('div'); d.className = 'toast'+(tipo==='error'?' error':''); d.textContent = msg;
  $('#toasts').appendChild(d); setTimeout(()=>d.remove(), 4800);
}
function popup(texto, color){   // número flotante tipo "+120 Hamons"
  const d = document.createElement('div'); d.className='flota'; d.textContent = texto; d.style.color = color||'var(--verde)';
  d.style.left = '50%'; d.style.top = '120px'; d.style.transform='translateX(-50%)';
  document.body.appendChild(d); setTimeout(()=>d.remove(), 1900);
}
function flashSaldo(){ const s=$('.saldo'); if(s){ s.classList.add('flash'); setTimeout(()=>s.classList.remove('flash'),900);} }

// Estado de una tarea: el Auditor solo puede actuar mientras dure la ventana (15 min)
function estadoDe(h){
  if(h.reportada) return h.estado;                         // SABOTEADA o VERIFICADA por reporte
  return (Date.now()-h.ts > ventanaMs()) ? 'VERIFICADA' : 'PENDIENTE';
}

// Fotos simuladas (SVG embebido, funciona sin internet). "falsa" = imagen de stock con marca de agua.
function fotoSim(titulo, falsa){
  const t = esc(titulo), h = hora(Date.now());
  const svg = falsa
    ? `<svg xmlns='http://www.w3.org/2000/svg' width='360' height='220'><rect width='360' height='220' fill='#4b4f66'/>
       <g stroke='#ffffff30' stroke-width='3'>${[0,1,2,3,4,5,6,7].map(i=>`<line x1='${i*60-100}' y1='0' x2='${i*60+120}' y2='220'/>`).join('')}</g>
       <text x='180' y='100' fill='#fff' font-size='22' text-anchor='middle' font-family='Arial'>stock-photos.com</text>
       <text x='180' y='130' fill='#ddd' font-size='14' text-anchor='middle' font-family='Arial'>${t}</text></svg>`
    : `<svg xmlns='http://www.w3.org/2000/svg' width='360' height='220'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
       <stop offset='0' stop-color='#0f6b78'/><stop offset='1' stop-color='#1d2a6e'/></linearGradient></defs>
       <rect width='360' height='220' fill='url(#g)'/><rect x='20' y='20' width='320' height='180' rx='12' fill='none' stroke='#2de2ff' stroke-width='2'/>
       <text x='180' y='95' fill='#fff' font-size='20' text-anchor='middle' font-family='Arial'>Evidencia en sitio</text>
       <text x='180' y='125' fill='#2de2ff' font-size='15' text-anchor='middle' font-family='Arial'>${t}</text>
       <text x='180' y='170' fill='#9aa2d6' font-size='12' text-anchor='middle' font-family='Arial'>${h}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ============================================================
   5. RENDER: cada vista devuelve HTML. Los botones usan data-a="accion".
   ============================================================ */
function render(){
  $('#cabecera').innerHTML = vCabecera();
  $('#vista').innerHTML =
      vista==='lobby'   ? vLobby()
    : !S.roles          ? vLobby()
    : vista==='juego'   ? vJuego()
    : vista==='ruleta'  ? vRuleta()
    : vista==='subasta' ? vSubasta()
    : vImpacto();
  if(vista==='impacto' && impactoVisible) animarContadores();
}

function vCabecera(){
  const p = yo();
  const rolTxt = p && p.rol ? (p.rol==='AUDITOR' ? 'Auditor' : 'Trabajador') : null;
  let h = `<header class="barra"><div class="marca">Eco<span>Sabotage</span><small>${CFG.EMPRESA} · Barranquilla No Se Apaga</small></div>`;
  if(p){
    h += `<div class="cuenta"><div class="saldo"><strong>${nf(p.saldo)}</strong> Hamons</div>`;
    if(rolTxt) h += `<span class="chip ${p.rol==='AUDITOR'?'auditor':''}">${rolTxt}</span>`;
    h += `<select data-change="cambiar" aria-label="Jugador activo">${S.players.map(x=>`<option value="${esc(x.name)}" ${x.name===S.activo?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`;
  }
  h += `</header>`;
  if(S.roles){
    const t=(v,n)=>`<button class="${vista===v?'on':''}" data-a="ir" data-v="${v}">${n}</button>`;
    h += `<nav class="tabs">${t('lobby','Jugadores')}${t('juego','Tareas')}${t('ruleta','Ruleta energética')}${t('subasta','Subasta')}${t('impacto','Impacto ODS')}</nav>`;
  }
  return h;
}

/* ---------- Vista 1: Lobby ---------- */
function vLobby(){
  const n = S.players.length, lleno = n >= CFG.MAX_JUGADORES;
  let h = '';
  if(!S.roles){
    h += `<section class="entrada"><h1>Jugadores: ${n}/${CFG.MAX_JUGADORES}</h1>
      <p>Equipo de <b>${CFG.EMPRESA}</b>. Al entrar el sexto jugador se sortean los roles en secreto: 1 Auditor (impostor) y 5 Trabajadores.</p>
      <div class="fila" style="justify-content:center">
        <input type="text" id="nombre" placeholder="Nombre del jugador" maxlength="20" ${lleno?'disabled':''} data-enter="unirse">
        <button class="btn" data-a="unirse" ${lleno?'disabled':''}>Unirme al lobby</button>
      </div>
      <p class="fila" style="justify-content:center">
        <button class="link" data-a="autollenar">Autollenar jugadores (demo)</button>
        <button class="link" data-a="iniciar" ${n<2?'disabled':''}>Iniciar con los ${n} actuales</button>
      </p></section>`;
  } else {
    h += `<section class="entrada"><h2>Jugadores de ${CFG.EMPRESA}</h2>
      <p>Los roles son secretos. Cambia de jugador desde el selector del encabezado para ver cada pantalla.</p>
      <label class="fila" style="justify-content:center"><input type="checkbox" data-change="mostrarRoles" ${S.mostrarRoles?'checked':''}> Modo demo: mostrar los roles de todos</label></section>`;
  }
  h += `<div class="asientos">`;
  for(let i=0;i<CFG.MAX_JUGADORES;i++){
    const p = S.players[i];
    if(!p){ h += `<div class="asiento">Asiento libre</div>`; continue; }
    const visible = S.roles && (S.mostrarRoles || p.name===S.activo);
    const rolHtml = !S.roles ? 'Esperando sorteo…' : visible
      ? `<div class="rol ${p.rol==='AUDITOR'?'aud':'trab'}">${p.rol==='AUDITOR'?'AUDITOR (impostor)':'Trabajador'}</div>` : `<div class="rol">Rol secreto</div>`;
    h += `<div class="asiento lleno ${p.name===S.activo?'activo':''}"><strong>${esc(p.name)}</strong>${S.roles?rolHtml:`<div class="rol">${rolHtml}</div>`}
      <span class="nota">${nf(p.saldo)} Hamons</span>
      ${S.roles?`<br><button class="link" data-a="jugarComo" data-n="${esc(p.name)}">Jugar como ${esc(p.name)}</button>`:''}</div>`;
  }
  h += `</div>
    <p style="text-align:center"><button class="link" data-a="reiniciar">Reiniciar toda la partida</button></p>`;
  return h;
}

/* ---------- Vista 2: Dashboard (Trabajador / Auditor) ---------- */
function vJuego(){
  const p = yo(); if(!p) return '';
  const aud = p.rol==='AUDITOR';
  let h = `<div class="banner ${aud?'auditor':''}">${aud?'ERES EL AUDITOR':'ERES TRABAJADOR'}</div>`;
  if(!aud){
    h += `<h2>Tareas de ahorro</h2><p class="nota">Cada tarea paga Hamons al azar dentro de su rango. Sube una foto-prueba: el Auditor te vigila ${S.ventanaMin} min.</p><div class="rejilla">`;
    TAREAS.forEach(t=>{
      h += `<article class="card"><h3>${t.titulo}</h3><p>${t.desc}</p><p class="meta">${t.min}–${t.max} Hamons · ${t.kwh} kWh</p>
        <button class="btn" data-a="abrirTarea" data-id="${t.id}">Completar tarea</button></article>`;
    });
    h += `</div><h2>Mis tareas recientes</h2>`;
    const mias = S.hechas.filter(x=>x.user===p.name).slice(0,6);
    h += mias.length ? `<div class="rejilla">${mias.map(x=>{
      const e = estadoDe(x);
      return `<article class="card ${e==='SABOTEADA'?'sabot':''}"><h3>${esc(x.titulo)}</h3><p>${hora(x.ts)} · ${x.hamons} Hamons</p>${etiqueta(e)}</article>`;
    }).join('')}</div>` : `<p class="vacio">Aún no has completado tareas. Elige una arriba.</p>`;
  } else {
    h += `<h2>Panel del Auditor</h2>
      <div class="fila"><p class="nota" style="margin:0">Tareas dentro de la ventana de auditoría. Pasado el tiempo, quedan firmes.</p>
      <label class="nota" style="margin:0">Ventana: <select data-change="ventana">
        <option value="15" ${S.ventanaMin===15?'selected':''}>15 min (real)</option><option value="1" ${S.ventanaMin===1?'selected':''}>1 min (demo rápida)</option></select></label></div>
      <p class="nota">Acusación válida: robas los Hamons de la tarea. Acusación errónea: -${CFG.PENALIZACION} Hamons.</p>`;
    const recientes = S.hechas.filter(x => Date.now()-x.ts <= ventanaMs() || x.reportada && Date.now()-x.ts <= ventanaMs()*2);
    h += recientes.length ? `<div class="rejilla">${recientes.map(x=>{
      const e = estadoDe(x);
      const accion = e==='PENDIENTE'
        ? `<button class="btn rojo" data-a="reportar" data-id="${x.id}">Reportar falsedad</button>` : etiqueta(e);
      return `<article class="card foto ${e==='SABOTEADA'?'sabot':''}"><img src="${x.foto}" alt="Foto-prueba de ${esc(x.user)}">
        <div class="cuerpo"><h3>${esc(x.titulo)}</h3><p class="meta">${esc(x.user)} · ${x.hamons} Hamons · ${hora(x.ts)}</p>
        ${e==='PENDIENTE'?`<div class="reloj" data-ts="${x.ts}">--:--</div>`:''}${accion}</div></article>`;
    }).join('')}</div>` : `<p class="vacio">Sin tareas por auditar. Cambia a un Trabajador y completa una tarea.</p>`;
  }
  return h;
}
function etiqueta(e){
  return e==='SABOTEADA' ? '<span class="etiqueta et-sab">Saboteada</span>'
       : e==='VERIFICADA' ? '<span class="etiqueta et-ok">Verificada</span>'
       : '<span class="etiqueta et-pend">Pendiente de auditoría</span>';
}

/* ---------- Vista 3: Ruleta energética ---------- */
function vRuleta(){
  const sect = SECTORES.map((s,i)=>`<span class="sector" style="transform:rotate(${i*72+36}deg) translateY(-106px)">x${s}</span>`).join('');
  let res = '';
  if(ultimoResultado && !girando){
    const r = ultimoResultado;
    res = `<div class="resultado ${r.mult===5?'jackpot':''} ${r.mult===0?'pierde':''}"><strong>${r.mult===5?'JACKPOT x5':'x'+r.mult}</strong>
      <span>${r.premio>0?'Recibes '+r.premio+' Hamons':'Perdiste los '+CFG.COSTO_RULETA+' Hamons'}</span></div>`;
  }
  return `<section class="centro"><h2>Casino de la Eficiencia</h2>
    <p class="nota">Disponible para Trabajadores y Auditor. Multiplicadores: x0, x0.5, x1.5, x3 y Jackpot x5.</p>
    <div class="ruleta-wrap"><div class="puntero"></div><div class="rueda" id="rueda" style="transform:rotate(${rotacion}deg)">${sect}</div></div>
    <button class="btn ambar grande" data-a="girar" ${girando?'disabled':''}>Girar ruleta (Costo: ${CFG.COSTO_RULETA} Hamons)</button>${res}</section>`;
}

/* ---------- Vista 4: Subasta ---------- */
function vSubasta(){
  const p = yo(), abierta = subastaAbierta();
  let h = `<h2>Subasta de premios corporativos</h2>
    <div class="fila"><p class="nota" style="margin:0">Tus Hamons quedan retenidos mientras vas ganando; si te superan, se devuelven.</p>
    ${abierta?`<span class="cierre" data-fin="${S.subastaFin}">--:--</span>`:`<span class="etiqueta et-sab">Subasta cerrada</span>`}</div>
    <div class="rejilla" style="margin-top:14px">`;
  S.premios.forEach(pr=>{
    const sig = pr.alta ? pr.alta + CFG.INCREMENTO_PUJA : pr.base;
    const voy = pr.ganador===p.name;
    h += `<article class="card ${voy?'gana':''}"><h3>${pr.titulo}</h3>
      <p class="puja">${nf(pr.alta||pr.base)} <small>Hamons</small></p>
      <p class="meta">${pr.ganador ? (abierta?'Va ganando: ':'Ganó: ')+(voy?'tú':esc(pr.ganador)) : 'Sin pujas todavía'}</p>
      <button class="btn" data-a="pujar" data-id="${pr.id}" ${(!abierta||voy)?'disabled':''}>Pujar +${CFG.INCREMENTO_PUJA} Hamons (${nf(sig)})</button></article>`;
  });
  h += `</div>`;
  if(abierta) h += `<p style="text-align:center"><button class="link" data-a="cerrarSubasta">Cerrar subasta ahora (demo)</button></p>`;
  return h;
}

/* ---------- Vista 5: Impacto ambiental ---------- */
function calcImpacto(){
  const validas = S.hechas.filter(h => estadoDe(h)!=='SABOTEADA');   // lo saboteado no cuenta
  const kwh = validas.reduce((a,h)=>a+h.kwh,0);
  return {kwh, cop:kwh*CFG.COP_POR_KWH, co2:kwh*CFG.KG_CO2_POR_KWH, arboles:kwh*CFG.KG_CO2_POR_KWH/CFG.KG_CO2_POR_ARBOL_ANIO,
          validas:validas.length, sab:S.hechas.length-validas.length};
}
function vImpacto(){
  if(!impactoVisible){
    return `<section class="entrada"><h2>Cierre de la jornada</h2><p>Calcula lo que logró ${CFG.EMPRESA} entre todos.</p>
      <button class="btn grande" data-a="verImpacto">Ver impacto ODS</button>
      <p><button class="link" data-a="semanaSim">Cargar semana simulada (demo)</button></p></section>`;
  }
  const i = calcImpacto();
  return `<h2>Impacto de ${CFG.EMPRESA}</h2>
    <div class="metricas">
      <div class="metrica"><strong data-count="${i.kwh}" data-dec="1">0</strong><span>kWh ahorrados</span></div>
      <div class="metrica"><strong data-count="${i.cop}" data-dec="0" data-pre="$ ">0</strong><span>COP ahorrados en la factura (estimado)</span></div>
      <div class="metrica"><strong data-count="${i.co2}" data-dec="1">0</strong><span>kg de CO₂ evitados</span></div>
      <div class="metrica"><strong data-count="${i.arboles}" data-dec="2">0</strong><span>árboles al año equivalentes</span></div>
    </div>
    <p class="nota">${i.validas} tareas válidas · ${i.sab} saboteadas por el Auditor (no cuentan).</p>
    <div class="ods">
      <div><b>ODS 7 · Energía asequible y no contaminante</b>Menos consumo en horas pico por El Niño: menos presión sobre la red y menos riesgo de apagones.</div>
      <div><b>ODS 12 · Producción y consumo responsables</b>Hábitos de ahorro medibles dentro de la empresa, con incentivos y auditoría entre pares.</div>
    </div>
    <p class="nota">Valores estimativos: ${CFG.COP_POR_KWH} COP/kWh, ${CFG.KG_CO2_POR_KWH} kg CO₂/kWh, ${CFG.KG_CO2_POR_ARBOL_ANIO} kg CO₂ por árbol al año. Ajustar con datos de factura.</p>
    <p><button class="link" data-a="semanaSim">Cargar semana simulada (demo)</button></p>`;
}
function animarContadores(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const fin = parseFloat(el.dataset.count), dec = +el.dataset.dec, pre = el.dataset.pre||'', t0 = performance.now();
    (function paso(t){
      const k = Math.min(1,(t-t0)/1200), v = fin*(1-Math.pow(1-k,3));
      el.textContent = pre + v.toLocaleString('es-CO',{minimumFractionDigits:dec,maximumFractionDigits:dec});
      if(k<1) requestAnimationFrame(paso);
    })(t0);
  });
}

/* ---------- Modales ---------- */
function modalHtml(html){ $('#modal').innerHTML = `<div class="fondo-modal"><div class="modal">${html}</div></div>`; }
function cerrarModal(){ $('#modal').innerHTML=''; tareaModal=null; fotoSubida=null; }
function revelarRol(){
  const p = yo(); if(!p||!p.rol||p.visto) return;
  const aud = p.rol==='AUDITOR';
  modalHtml(`<div class="revela ${aud?'aud':''}"><p class="nota">Tu rol, ${esc(p.name)}</p><h1>${aud?'ERES EL AUDITOR':'ERES TRABAJADOR'}</h1>
    <p class="nota">${aud?'Revisa las fotos-prueba. Un reporte válido te hace robar Hamons; uno falso te cuesta '+CFG.PENALIZACION+'.':'Completa tareas de ahorro con foto real. Cuidado: el Auditor te vigila.'}</p>
    <button class="btn" data-a="entendido">Entendido</button></div>`);
}

/* ============================================================
   6. ACCIONES (lógica del juego)
   ============================================================ */
const A = {
  ir(d){ vista = d.v; render(); },

  /* --- Lobby --- */
  unirse(){
    const inp = $('#nombre'); const name = (inp.value||'').trim();
    if(!name) return toast('Escribe un nombre.','error');
    if(S.players.some(p=>p.name.toLowerCase()===name.toLowerCase())) return toast('Ese nombre ya está en el lobby.','error');
    S.players.push({name, rol:null, saldo:CFG.SALDO_INICIAL, visto:false});
    if(!S.activo) S.activo = name;
    if(S.players.length>=CFG.MAX_JUGADORES) asignarRoles();   // al entrar el último, se sortea
    guardar(); render(); if(S.roles) revelarRol();
  },
  autollenar(){
    ['Ana','Bruno','Carla','Diego','Elena','Felipe'].forEach(n=>{
      if(S.players.length<CFG.MAX_JUGADORES && !S.players.some(p=>p.name===n))
        S.players.push({name:n, rol:null, saldo:CFG.SALDO_INICIAL, visto:false});
    });
    if(!S.activo) S.activo = S.players[0].name;
    if(S.players.length>=CFG.MAX_JUGADORES) asignarRoles();
    guardar(); render(); if(S.roles) revelarRol();
  },
  iniciar(){ if(S.players.length<2) return; asignarRoles(); guardar(); render(); revelarRol(); },
  jugarComo(d){ S.activo = d.n; guardar(); render(); revelarRol(); },
  entendido(){ const p=yo(); if(p) p.visto = true; guardar(); cerrarModal(); vista='juego'; render(); },
  reiniciar(){ if(confirm('¿Reiniciar toda la partida?')){ S = estadoNuevo(); vista='lobby'; impactoVisible=false; ultimoResultado=null; guardar(); render(); } },

  /* --- Tareas del Trabajador --- */
  abrirTarea(d){
    const t = TAREAS.find(x=>x.id==d.id); tareaModal = t; fotoSubida = null;
    modalHtml(`<h3>${t.titulo}</h3><p class="nota">Rango: ${t.min}–${t.max} Hamons (se sortea al enviar).</p>
      <label class="nota">Adjunta tu foto-prueba (opcional):</label>
      <input type="file" id="archivo" accept="image/*" data-change="archivo">
      <div id="prev"><p class="nota">Si no subes foto, se usará una foto simulada.</p></div>
      <label class="fila nota"><input type="checkbox" id="chkFalsa"> Simular foto falsa (para probar al Auditor)</label>
      <div class="fila" style="margin-top:12px"><button class="btn" data-a="enviarPrueba">Enviar prueba</button>
      <button class="link" data-a="cerrarModal">Cancelar</button></div>`);
  },
  cerrarModal(){ cerrarModal(); },
  enviarPrueba(){
    const p = yo(), t = tareaModal; if(!p||!t) return;
    const falsa = $('#chkFalsa').checked;
    const ganados = rnd(t.min, t.max);                        // Hamons ALEATORIOS dentro del rango
    S.hechas.unshift({id:S.nextId++, user:p.name, tid:t.id, titulo:t.titulo, kwh:t.kwh, hamons:ganados,
      foto: fotoSubida || fotoSim(t.titulo, falsa), falsa, ts:Date.now(), reportada:false, estado:'PENDIENTE'});
    p.saldo += ganados;
    guardar(); cerrarModal(); render(); flashSaldo(); popup('+'+ganados+' Hamons');
  },

  /* --- Auditor --- */
  reportar(d){
    const aud = yo(), h = S.hechas.find(x=>x.id==d.id);
    if(!aud||!h) return;
    if(estadoDe(h)!=='PENDIENTE') return toast('La ventana de auditoría ya cerró.','error');
    h.reportada = true;
    if(h.falsa){                                              // acusación válida: roba los Hamons
      const trab = S.players.find(p=>p.name===h.user);
      const robo = Math.min(h.hamons, trab.saldo);
      trab.saldo -= robo; aud.saldo += robo; h.estado = 'SABOTEADA';
      toast(`Denuncia válida: le robaste ${robo} Hamons a ${trab.name}.`); popup('+'+robo+' robados','var(--magenta)');
    } else {                                                  // acusación errónea: penalización
      aud.saldo = Math.max(0, aud.saldo - CFG.PENALIZACION); h.estado = 'VERIFICADA';
      toast(`Denuncia rechazada: la foto era válida. Penalización de -${CFG.PENALIZACION} Hamons.`,'error'); popup('-'+CFG.PENALIZACION,'var(--magenta)');
    }
    guardar(); render(); flashSaldo();
  },

  /* --- Ruleta --- */
  girar(){
    const p = yo(); if(!p||girando) return;
    if(p.saldo < CFG.COSTO_RULETA) return toast('Necesitas '+CFG.COSTO_RULETA+' Hamons para girar.','error');
    p.saldo -= CFG.COSTO_RULETA;
    // sorteo ponderado
    let tot = RULETA.reduce((a,r)=>a+r[1],0), x = Math.random()*tot, mult = 0;
    for(const [m,w] of RULETA){ if((x-=w)<0){ mult=m; break; } }
    const premio = Math.floor(CFG.COSTO_RULETA*mult);
    // animación: la rueda gira y se detiene con el sector ganador bajo el puntero
    const idx = SECTORES.indexOf(mult);
    const destino = rotacion - (rotacion%360) + 360*6 + (360-(idx*72+36));
    girando = true; ultimoResultado = null; guardar(); render();   // se redibuja con el ángulo anterior
    const rueda = $('#rueda'); rueda.getBoundingClientRect();
    rotacion = destino;
    rueda.classList.add('gira'); rueda.style.transform = `rotate(${destino}deg)`;
    setTimeout(()=>{
      p.saldo += premio; girando = false; ultimoResultado = {mult, premio};
      guardar(); render(); flashSaldo();
      popup(premio>0?'+'+premio+' Hamons':'x0 · perdiste', premio>0?'var(--verde)':'var(--magenta)');
    }, 3600);
  },

  /* --- Subasta --- */
  pujar(d){
    const p = yo(), pr = S.premios.find(x=>x.id==d.id);
    if(!p||!pr) return;
    if(!subastaAbierta()) return toast('La subasta ya cerró.','error');
    const monto = pr.alta ? pr.alta + CFG.INCREMENTO_PUJA : pr.base;
    if(pr.ganador===p.name) return toast('Ya vas ganando este premio.','error');
    if(p.saldo < monto) return toast('No tienes Hamons suficientes ('+nf(monto)+').','error');
    if(pr.ganador){ const ant = S.players.find(x=>x.name===pr.ganador); if(ant) ant.saldo += pr.alta; }  // devuelve la puja anterior
    p.saldo -= monto; pr.alta = monto; pr.ganador = p.name;
    guardar(); render(); flashSaldo(); toast('Vas ganando: '+pr.titulo);
  },
  cerrarSubasta(){ S.subastaCerrada = true; guardar(); render(); toast('Subasta cerrada.'); },

  /* --- Impacto --- */
  verImpacto(){ impactoVisible = true; render(); },
  semanaSim(){   // demo: genera actividad verificada de una semana para que el panel tenga datos
    S.players.filter(p=>p.rol==='TRABAJADOR').forEach(p=>{
      for(let i=0;i<4;i++){
        const t = TAREAS[rnd(0,TAREAS.length-1)], g = rnd(t.min,t.max);
        S.hechas.push({id:S.nextId++, user:p.name, tid:t.id, titulo:t.titulo, kwh:t.kwh, hamons:g, foto:fotoSim(t.titulo,false),
          falsa:false, ts:Date.now()-ventanaMs()-rnd(60000,3600000), reportada:false, estado:'VERIFICADA'});
        p.saldo += g;
      }
    });
    impactoVisible = true; guardar(); render(); toast('Semana simulada cargada.');
  }
};

function asignarRoles(){
  const idx = S.players.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){ const j=rnd(0,i); [idx[i],idx[j]]=[idx[j],idx[i]]; }   // Fisher-Yates
  S.players.forEach((p,i)=>{ p.rol = (i===idx[0]) ? 'AUDITOR' : 'TRABAJADOR'; p.visto = false; });
  S.roles = true; vista = 'juego';
  S.subastaFin = Date.now() + CFG.SUBASTA_MIN*60000;
}

/* ============================================================
   7. EVENTOS (delegación) + RELOJ + SINCRONIZACIÓN ENTRE PESTAÑAS
   ============================================================ */
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-a]'); if(!b || b.disabled) return;
  const f = A[b.dataset.a]; if(f) f(b.dataset);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.dataset && e.target.dataset.enter) A[e.target.dataset.enter]();
});
document.addEventListener('change', e=>{
  const k = e.target.dataset && e.target.dataset.change; if(!k) return;
  if(k==='cambiar'){ S.activo = e.target.value; guardar(); render(); revelarRol(); }
  if(k==='mostrarRoles'){ S.mostrarRoles = e.target.checked; guardar(); render(); }
  if(k==='ventana'){ S.ventanaMin = +e.target.value; guardar(); render(); }
  if(k==='archivo'){                         // reduce la foto para no llenar localStorage
    const file = e.target.files[0]; if(!file) return;
    const rd = new FileReader();
    rd.onload = () => { const img = new Image(); img.onload = () => {
      const w = 360, h = Math.round(img.height*w/img.width), c = document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h); fotoSubida = c.toDataURL('image/jpeg',.6);
      $('#prev').innerHTML = `<img src="${fotoSubida}" alt="Vista previa">`;
    }; img.src = rd.result; };
    rd.readAsDataURL(file);
  }
});
// Si abres la app en otra pestaña/ventana, el estado se comparte en vivo.
window.addEventListener('storage', e=>{ if(e.key===KEY){ S = cargar(); if(!girando) render(); } });

// Reloj de 1 segundo: actualiza cuentas regresivas sin redibujar toda la pantalla.
setInterval(()=>{
  let redibujar = false;
  document.querySelectorAll('[data-ts]').forEach(el=>{
    const rest = Math.max(0, Math.ceil((+el.dataset.ts + ventanaMs() - Date.now())/1000));
    el.textContent = fmt(rest); el.classList.toggle('urgente', rest<60);
    if(rest===0) redibujar = true;
  });
  const f = document.querySelector('[data-fin]');
  if(f){
    const rest = Math.max(0, Math.ceil((+f.dataset.fin - Date.now())/1000));
    f.textContent = fmt(rest);
    if(rest===0){ S.subastaCerrada = true; guardar(); redibujar = true; }
  }
  if(redibujar && !girando) render();
}, 1000);

render();
if(S.roles) revelarRol();
</script>
